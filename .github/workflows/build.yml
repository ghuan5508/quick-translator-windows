name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "QuickTranslator/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish self-contained EXE
        run: dotnet publish .\QuickTranslator\QuickTranslator.csproj -c Release -r win-x64 --self-contained true -o .\publish

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: QuickTranslator-windows-x64
          path: publish/QuickTranslator.exe
          if-no-files-found: error
          retention-days: 14
