name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "QuickTranslator/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Normalize XML encoding
        shell: pwsh
        run: |
          Get-ChildItem .\QuickTranslator -Recurse -File |
            Where-Object { $_.Extension -in '.xaml', '.csproj' } |
            ForEach-Object {
              $path = $_.FullName
              $text = [IO.File]::ReadAllText($path).TrimStart([char]0xFEFF)
              [IO.File]::WriteAllText($path, $text, [Text.UTF8Encoding]::new($false))
            }

      - name: Publish self-contained EXE
        run: dotnet publish .\QuickTranslator\QuickTranslator.csproj -c Release -r win-x64 --self-contained true -o .\publish

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: QuickTranslator-windows-x64
          path: publish/QuickTranslator.exe
          if-no-files-found: error
          retention-days: 14
